[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "brighteyes"
version = "0.1.0"
description = "Toolbox for image scanning microscopy and fluorescence fluctuation spectroscopy with array detectors"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
  { name = "Alessandro Zunino", email = "alessandro.zunino@iit.it" },
  { name = "Eli Slenders", email = "eli.slenders@iit.it" },
  { name = "Mattia Donato", email = "mattia.donato@iit.it" },
]

[project.optional-dependencies]
imaging = [
    "brighteyes-mcs-dataprep>=0.1.0",
    "brighteyes-mcs-reader>=0.1.0",
    "h5py>=3.16.0",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "matplotlib-scalebar>=0.9.0",
    "numpy>=2.4.6",
    "psf-generator<=0.0.2",
    "requests>=2.34.2",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
    "zernikepy>=0.0.5",
]
spectroscopy = [
    "brighteyes[imaging]",
    "czifile>=2019.7.2.3",
    "h5py>=3.16.0",
    "imutils>=0.5.4",
    "joblib>=1.6.0",
    "matplotlib>=3.3.2",
    "multipletau>=0.3.3",
    "numpy>=1.19.4",
    "ome-types>=0.5.3",
    "opencv-python-headless>=5.0.0.93",
    "openpyxl>=3.1.5",
    "pandas>=1.1.4",
    "phconvert>=0.10.2",
    "ptufile>=2026.2.6",
    "pydantic<2.0",
    "pyqt5>=5.15.11",
    "qdarkstyle>=3.2.3",
    "rfc3987>=1.3.8",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tifffile>=2020.9.29",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.build-backend]
module-name = "brighteyes"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
brighteyes = { workspace = true }
brighteyes-ism = { git = "https://github.com/VicidominiLab/BrightEyes-ISM", rev = "d799720" }
brighteyes-flism = { git = "https://github.com/VicidominiLab/BrightEyes-FLISM", rev = "85f0d96" }
brighteyes-ffs = { git = "https://github.com/VicidominiLab/BrightEyes-FFS", rev = "f6d640d" }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "towncrier>=26.9.0",
]
examples = [
    "jupyterlab>=4.6.5",
    "nbformat==5.8.0",
]
reference = [
    "brighteyes-ffs",
    "brighteyes-flism",
    "brighteyes-ism",
]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[tool.ruff]
line-length = 88
extend-exclude = [
    "src/brighteyes/imaging",
    "src/brighteyes/spectroscopy",
    "examples",
    "docs/imaging-ism",
]

[tool.ruff.lint]
extend-select = ["D", "E402", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.towncrier]
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## [{version}](https://github.com/VicidominiLab/BrightEyes/releases/tag/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/VicidominiLab/BrightEyes/pull/{issue})"
# set, even empty, so a misnamed entry fails the build instead of being skipped
ignore = []

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"

[[tool.towncrier.type]]
directory = "added"
name = "Added"

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"

[[tool.towncrier.type]]
directory = "security"
name = "Security"
